<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Link to APK Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
        <h2 class="text-2xl font-bold mb-2 text-center text-indigo-400">URL to APK Builder</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Convert any web link into a real Android .APK file</p>
        
        <form id="apkForm" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Target Website URL</label>
                <input type="url" id="targetUrl" required placeholder="https://example.com" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">App Name</label>
                <input type="text" id="appName" required placeholder="My Android App" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg text-sm font-semibold transition">
                Start Compiling APK
            </button>
        </form>

        <div id="status" class="hidden mt-4 p-4 rounded-lg bg-slate-900 border border-slate-700 text-xs text-center"></div>
    </div>

    <script>
        const GITHUB_USERNAME = 'afridihameed119-a11y'; 
        const REPO_NAME = 'url-to-apk-builder';
        const GITHUB_TOKEN = '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';

        document.getElementById('apkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            const url = document.getElementById('targetUrl').value;
            const name = document.getElementById('appName').value;

            btn.disabled = true;
            btn.innerText = 'Connecting to Server...';
            status.classList.remove('hidden');
            status.innerHTML = '<span class="text-yellow-400">⏳ Sending build signal to GitHub Cloud...</span>';

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/actions/workflows/build-apk.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            app_url: url,
                            app_name: name
                        }
                    })
                });

                if (response.ok) {
                    status.innerHTML = `
                        <span class="text-green-400 font-bold">✅ Build Triggered Successfully!</span><br><br>
                        Aapki APK file compile hona shuru ho gayi hai.<br>
                        <a href="https://github.com/${GITHUB_USERNAME}/${REPO_NAME}/actions" target="_blank" class="inline-block mt-2 bg-indigo-600 px-3 py-1 rounded text-white font-medium">
                            Check Build Status & Download APK ➔
                        </a>
                    `;
                } else {
                    status.innerHTML = `<span class="text-red-400">❌ Error:</span> Build trigger fail ho gaya. Workflow file path ya token permissions check karein.`;
                }
            } catch (err) {
                status.innerText = 'Network error occurred.';
            }

            btn.disabled = false;
            btn.innerText = 'Start Compiling APK';
        });
    </script>
</body>
</html>
